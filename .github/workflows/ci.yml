name: BlackCrest Nexus CI

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://user:password@localhost:5432/dummy_db"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install Root Dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Frontend Dependencies
        run: npm install --prefix frontend --legacy-peer-deps

      - name: Install Server Dependencies
        run: npm install --prefix server --legacy-peer-deps

      - name: Validate Production Build
        run: npm run validate

      - name: Validate Frontend Dist
        run: |
          if [ ! -f frontend/dist/index.html ]; then
            echo "Frontend build failed. dist/index.html missing"
            exit 1
          fi
